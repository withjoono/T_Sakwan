name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # @withjoono/geobuk-shared 는 GitHub Packages 비공개 패키지 → 토큰 없으면 401.
      # pnpm 10 은 프로젝트 .npmrc 의 registry 자격증명을 확장하지 않으므로 user-level 에 기록한다.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.NODE_AUTH_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project=ts-front-479305 --token "${{ secrets.FIREBASE_TOKEN }}"
